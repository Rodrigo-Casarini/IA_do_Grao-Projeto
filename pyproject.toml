[project]
name = "ia-do-grao"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==6.0.4",
    "Pillow==12.2.0",
    "torch==2.14.0+cpu",
    "torchvision==0.29.0+cpu",
    "ultralytics==8.4.143",
    "whitenoise==6.9.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
